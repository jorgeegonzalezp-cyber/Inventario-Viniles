<!DOCTYPE html>
<html lang="es">

<head>

             TAB 1 - ESCANEAR
        ================================================== -->

            id="tab-scan"
            class="tab-content space-y-4"
        >


            <!-- FOTO -->

            <div

            >

                <h2
                    class="text-lg font-semibold text-slate-200 mb-3 flex items-center gap-2"

                    <i

                    ></i>

                    Escanear Portada

                <div

                    onclick="document.getElementById('fileInput').click()"
                >

                    <input
                        type="file"
                        id="fileInput"
                        accept="image/*"
                        capture="environment"
                        class="hidden"
                        onchange="handleImageSelection(event)"
                    >


                    <div
                        id="dropZoneContent"
                        class="space-y-2"
                    >

                        <i
                            class="fa-solid fa-cloud-arrow-up text-3xl text-emerald-400"
                        ></i>

                        <p class="text-sm text-slate-300">
                            Toca para tomar foto o subir portada
                        </p>

                        <p class="text-xs text-slate-500">
                            Gemini IA leerá los datos automáticamente
                        </p>

                    </div>



                    <div
                        id="imagePreviewContainer"
                        class="hidden relative"
                    >

                        <img
                            id="imagePreview"
                            class="max-h-56 mx-auto rounded-lg shadow-md object-contain"
                        >


                        <button
                            onclick="event.stopPropagation(); resetImageCapture();"
                            class="absolute top-2 right-2 bg-slate-900/80 hover:bg-red-500 text-slate-200 p-2 rounded-full text-xs transition shadow"
                        >

                            <i
                                class="fa-solid fa-xmark"
                            ></i>

                        </button>

                    </div>

                </div>



                <!-- ESTADO GEMINI -->

                <div
                    id="aiLoading"
                    class="hidden mt-4 text-center py-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400 text-sm"
                >

                    <i
                        class="fa-solid fa-wand-magic-sparkles animate-bounce"
                    ></i>

                    Analizando disco con IA...

                </div>

            </div>



            <!-- =================================================
                 FORMULARIO
            ================================================== -->

            <div
                class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3"
            >

                <h2
                    class="text-lg font-semibold text-slate-200 mb-2"
                >
                    Detalles del Disco
                </h2>


                <!-- ARTISTA / TITULO -->

                <div class="grid grid-cols-2 gap-3">

                    <div>

                        <label
                            class="text-xs text-slate-400 font-medium"
                        >
                            Artista *
                        </label>

                        <input
                            type="text"
                            id="formArtist"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-emerald-500 focus:outline-none"
                        >

                    </div>


                    <div>

                        <label
                            class="text-xs text-slate-400 font-medium"
                        >
                            Álbum / Título *
                        </label>

                        <input
                            type="text"
                            id="formTitle"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-emerald-500 focus:outline-none"

                    </div>

                </div>



                <!-- FORMATO / AÑO / GENERO -->

                <div class="grid grid-cols-3 gap-2">

                    <div>

                        <label
                            class="text-xs text-slate-400 font-medium"

                            Formato

                        <select

                            <option value="Vinilo">
                                Vinilo

                            <option value="CD">
                                CD
                            </option>

                            <option value="Casete">
                                Casete
                            </option>

                        </select>

                    </div>



                    <div>

                        <label
                            class="text-xs text-slate-400 font-medium"
                        >
                            Año

                        <input

                            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-emerald-500 focus:outline-none"

                    <div>

                    Vinilos

                <button

                    class="flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition"

                    CDs

            <!-- BUSCADOR -->

        <!-- =================================================
             TAB 3 - AJUSTES
        ================================================== -->

            >

                <h2

                >

                        Guardar Configuración

                    <button

                        Probar

    <!-- =====================================================
         NAVEGACION
    ====================================================== -->

    <nav
        class="bg-slate-900 border-t border-slate-800 fixed bottom-0 left-0 right-0 max-w-md mx-auto flex justify-around p-3 z-50"

        <button

            <span class="text-[10px] mt-1">
                Escanear
            </span>

        </button>



        <button
            onclick="switchTab('collection')"
            id="nav-collection"
            class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition"
        >

            <i class="fa-solid fa-compact-disc text-lg"></i>

            <span class="text-[10px] mt-1">
                Colección
            </span>

        </button>



        <button

            class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition"
        >

            <i class="fa-solid fa-gear text-lg"></i>

                Ajustes

    <!-- =====================================================
         MODAL
    ====================================================== -->

        >

            <div

                class="text-3xl text-emerald-400"
            ></div>


            <h3
                id="modalTitle"
                class="font-bold text-slate-100"

                Aviso
            </h3>


            <p

                class="text-xs text-slate-300"
            ></p>


            <button
                onclick="closeModal()"
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-xl text-xs transition"
            >
                Aceptar
            </button>

        </div>

<script>


/* =========================================================
   CONFIGURACION
========================================================= */

const DEFAULT_GAS_URL =
    "https://script.google.com/macros/s/AKfycbw5om1Z0fb9rVY6PJfLYnwdafZengkv5wFaoL3d8EYNzVFO2x18TKw4KWnaLp3-PlJ1yQ/exec";


let currentImageBase64 = "";

let fullCollectionData = [];

let currentCollectionFilter = "todos";



/* =========================================================
   INICIO
========================================================= */

window.onload = function () {

    let savedUrl =
        localStorage.getItem("gas_url");

    if (!savedUrl) {

        savedUrl = DEFAULT_GAS_URL;

        localStorage.setItem(
            "gas_url",
            savedUrl
        );

    }

    document.getElementById(
        "settingUrl"
    ).value = savedUrl;


    testConnection();

    loadCollection();

};



/* =========================================================
   NAVEGACION
========================================================= */

function switchTab(tabName) {

    document
        .querySelectorAll(".tab-content")
        .forEach(function (el) {

            el.classList.add("hidden");

        });


    document
        .getElementById(
            "tab-" + tabName
        )
        .classList
        .remove("hidden");


    [
        "scan",
        "collection",
        "settings"

    ].forEach(function (t) {

        const btn =
            document.getElementById(
                "nav-" + t
            );


        btn.className =
            t === tabName

                ? "flex flex-col items-center text-emerald-400 transition"

                : "flex flex-col items-center text-slate-400 hover:text-slate-200 transition";

    });


    if (
        tabName === "collection"
    ) {

        loadCollection();

    }

}



/* =========================================================
   FILTROS
========================================================= */

function setCollectionFilter(filter) {

    currentCollectionFilter =
        filter;


    [
        "todos",
        "vinilo",
        "cd"

    ].forEach(function (f) {

        const btn =
            document.getElementById(
                "filter-" + f
            );


        if (
            f === filter
        ) {

            btn.className =
                "flex-1 py-2 text-xs font-medium rounded-lg bg-emerald-500 text-slate-950 transition shadow";

        } else {

            btn.className =
                "flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition";

        }

    });


    filterCollection();

}



/* =========================================================
   ESTADO CONEXION
========================================================= */

function updateStatus(
    isOnline,
    text
) {

    const statusEl =
        document.getElementById(
            "connectionStatus"
        );


    if (
        isOnline
    ) {

        statusEl.className =
            "text-xs px-2 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1";

        statusEl.innerHTML =
            '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ' +
            escapeHtml(text);

    } else {

        statusEl.className =
            "text-xs px-2 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/30 flex items-center gap-1";

        statusEl.innerHTML =
            '<span class="w-2 h-2 rounded-full bg-red-400"></span> ' +
            escapeHtml(text);

    }

}



/* =========================================================
   MODAL
========================================================= */

function showModal(
    title,
    message,
    isError = false
) {

    document.getElementById(
        "modalTitle"
    ).innerText = title;


    document.getElementById(
        "modalMessage"
    ).innerText = message;


    document.getElementById(
        "modalIcon"
    ).innerHTML =

        isError

            ? '<i class="fa-solid fa-triangle-exclamation text-red-400"></i>'

            : '<i class="fa-solid fa-circle-check text-emerald-400"></i>';


    document.getElementById(
        "appModal"
    ).classList.remove(
        "hidden"
    );

}



function closeModal() {

    document.getElementById(
        "appModal"
    ).classList.add(
        "hidden"
    );

}



/* =========================================================
   AJUSTES
========================================================= */

function saveSettings() {

    const url =
        document.getElementById(
            "settingUrl"
        ).value.trim();


    if (
        !url
    ) {

        showModal(
            "URL requerida",
            "Ingresa la URL de Apps Script.",
            true
        );

        return;

    }


    localStorage.setItem(
        "gas_url",
        url
    );


    showModal(
        "Guardado",
        "Enlace configurado correctamente."
    );


    testConnection();

    loadCollection();

}



/* =========================================================
   PROBAR CONEXION
========================================================= */

async function testConnection() {

    const url =
        localStorage.getItem(
            "gas_url"
        ) || DEFAULT_GAS_URL;


    try {

        const response =
            await fetch(
                url,
                {
                    method: "GET"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        updateStatus(
            true,
            "Conectado"
        );


        return data;

    } catch (error) {

        console.error(
            "Error conexión:",
            error
        );


        updateStatus(
            false,
            "Error de enlace"
        );

    }

}



/* =========================================================
   CAPTURA DE IMAGEN
========================================================= */

function handleImageSelection(event) {

    const file =
        event.target.files[0];


    if (
        !file
    ) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        showModal(
            "Archivo inválido",
            "Selecciona una imagen.",
            true
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function (e) {

            const img =
                new Image();


            img.onload =
                function () {


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    /*
                     * 1000px es suficiente para que
                     * Gemini lea una portada y mantiene
                     * reducido el tamaño del payload.
                     */

                    const MAX_WIDTH =
                        1000;

                    const MAX_HEIGHT =
                        1000;


                    let width =
                        img.width;

                    let height =
                        img.height;


                    if (
                        width > height
                    ) {

                        if (
                            width > MAX_WIDTH
                        ) {

                            height *=
                                MAX_WIDTH /
                                width;

                            width =
                                MAX_WIDTH;

                        }

                    } else {

                        if (
                            height > MAX_HEIGHT
                        ) {

                            width *=
                                MAX_HEIGHT /
                                height;

                            height =
                                MAX_HEIGHT;

                        }

                    }


                    width =
                        Math.round(
                            width
                        );

                    height =
                        Math.round(
                            height
                        );


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    currentImageBase64 =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.82
                        );


                    const preview =
                        document.getElementById(
                            "imagePreview"
                        );


                    preview.src =
                        currentImageBase64;


                    document.getElementById(
                        "imagePreviewContainer"
                    ).classList.remove(
                        "hidden"
                    );


                    document.getElementById(
                        "dropZoneContent"
                    ).classList.add(
                        "hidden"
                    );


                    analyzeImageWithGemini(
                        currentImageBase64
                    );

                };


            img.onerror =
                function () {

                    showModal(
                        "Error",
                        "No se pudo leer la imagen.",
                        true
                    );

                };


            img.src =
                e.target.result;

        };


    reader.readAsDataURL(
        file
    );

}



/* =========================================================
   RESETEAR IMAGEN
========================================================= */

function resetImageCapture() {

    currentImageBase64 =
        "";


    document.getElementById(
        "fileInput"
    ).value = "";


    document.getElementById(
        "imagePreview"
    ).src = "";


    document.getElementById(
        "imagePreviewContainer"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "dropZoneContent"
    ).classList.remove(
        "hidden"
    );

}



/* =========================================================
   ANALIZAR CON GEMINI
   LA API KEY YA NO ESTA EN EL INDEX
========================================================= */

async function analyzeImageWithGemini(
    base64Data
) {

    const loading =
        document.getElementById(
            "aiLoading"
        );


    loading.classList.remove(
        "hidden"
    );


    try {

        const url =
            localStorage.getItem(
                "gas_url"
            ) || DEFAULT_GAS_URL;


        if (
            !url
        ) {

            throw new Error(
                "No está configurada la URL de Apps Script."
            );

        }


        const response =
            await fetch(
                url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({
                            action:
                                "analyze",

                            photo:
                                base64Data
                        })
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Error HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            result.status !==
            "success"
        ) {

            throw new Error(
                result.message ||
                "No se pudo analizar la imagen."
            );

        }


        const data =
            result.data || {};


        document.getElementById(
            "formArtist"
        ).value =
            data.artist || "";


        document.getElementById(
            "formTitle"
        ).value =
            data.title || "";


        if (
            data.format
        ) {

            const fmt =
                String(
                    data.format
                ).toLowerCase();


            if (
                fmt.includes(
                    "cd"
                )
            ) {

                document.getElementById(
                    "formFormat"
                ).value =
                    "CD";

            } else {

                document.getElementById(
                    "formFormat"
                ).value =
                    "Vinilo";

            }

        }


        document.getElementById(
            "formYear"
        ).value =
            data.year || "";


        document.getElementById(
            "formGenre"
        ).value =
            data.genre || "";


        document.getElementById(
            "formLabel"
        ).value =
            data.label || "";


        document.getElementById(
            "formCondition"
        ).value =
            data.condition || "";


    } catch (error) {

        console.error(
            "Error Gemini:",
            error
        );


        showModal(
            "Error de reconocimiento",
            error.message ||
            "No se pudo analizar la portada.",
            true
        );


    } finally {

        loading.classList.add(
            "hidden"
        );

    }

}



/* =========================================================
   GUARDAR DISCO
========================================================= */

async function saveItem() {

    const url =
        localStorage.getItem(
            "gas_url"
        ) || DEFAULT_GAS_URL;


    if (
        !url
    ) {

        showModal(
            "Falta configurar",
            "Configura el enlace de Apps Script.",
            true
        );

        return;

    }


    const artistVal =
        document.getElementById(
            "formArtist"
        ).value.trim();


    const titleVal =
        document.getElementById(
            "formTitle"
        ).value.trim();


    if (
        !artistVal ||
        !titleVal
    ) {

        showModal(
            "Campos incompletos",
            "Ingresa al menos el artista y el título.",
            true
        );

        return;

    }


    const payload = {

        action:
            "save",

        artist:
            artistVal,

        title:
            titleVal,

        edition:
            "",

        format:
            document.getElementById(
                "formFormat"
            ).value,

        year:
            document.getElementById(
                "formYear"
            ).value,

        genre:
            document.getElementById(
                "formGenre"
            ).value,

        label:
            document.getElementById(
                "formLabel"
            ).value,

        condition:
            document.getElementById(
                "formCondition"
            ).value,

        location:
            document.getElementById(
                "formLocation"
            ).value,

        price:
            document.getElementById(
                "formPrice"
            ).value,

        photo:
            currentImageBase64

    };


    const btn =
        document.getElementById(
            "saveBtn"
        );


    btn.innerHTML =
        '<i class="fa-solid fa-spinner animate-spin"></i> Guardando...';


    btn.disabled =
        true;


    try {

        const response =
            await fetch(
                url,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            result.status !==
            "success"
        ) {

            throw new Error(
                result.message ||
                "El servidor no pudo guardar el disco."
            );

        }


        showModal(
            "Guardado",
            "Disco guardado correctamente en tu colección."
        );


        resetForm();


        await loadCollection();


    } catch (error) {

        console.error(
            "Error guardando:",
            error
        );


        showModal(
            "Error",
            error.message ||
            "No se pudo guardar el registro.",
            true
        );


    } finally {

        btn.innerHTML =
            '<i class="fa-solid fa-floppy-disk"></i> Guardar en Colección';


        btn.disabled =
            false;

    }

}



/* =========================================================
   RESET FORMULARIO
========================================================= */

function resetForm() {

    currentImageBase64 =
        "";


    document.getElementById(
        "fileInput"
    ).value =
        "";


    document.getElementById(
        "imagePreview"
    ).src =
        "";


    document.getElementById(
        "imagePreviewContainer"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "dropZoneContent"
    ).classList.remove(
        "hidden"
    );


    [
        "formArtist",
        "formTitle",
        "formYear",
        "formGenre",
        "formLabel",
        "formCondition",
        "formLocation",
        "formPrice"

    ].forEach(
        function (id) {

            document.getElementById(
                id
            ).value =
                "";

        }
    );


    document.getElementById(
        "formFormat"
    ).value =
        "Vinilo";

}



/* =========================================================
   CARGAR COLECCION
========================================================= */

async function loadCollection() {

    const url =
        localStorage.getItem(
            "gas_url"
        ) || DEFAULT_GAS_URL;


    if (
        !url
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                url +
                "?t=" +
                Date.now()
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            Array.isArray(
                data
            )
        ) {

            fullCollectionData =
                data;

        } else {

            console.error(
                "Respuesta colección:",
                data
            );

            fullCollectionData =
                [];

        }


        filterCollection();


    } catch (error) {

        console.error(
            "Error cargando colección:",
            error
        );


        document.getElementById(
            "collectionList"
        ).innerHTML =
            `
            <div class="text-center py-12 text-red-400 text-xs">
                No se pudo cargar la colección.
            </div>
            `;

    }

}



/* =========================================================
   URL DE IMAGEN
========================================================= */

function getDirectImageUrl(
    rawUrl
) {

    if (
        !rawUrl
    ) {

        return "";

    }


    rawUrl =
        String(
            rawUrl
        ).trim();


    /*
     * Las nuevas imágenes ya vienen como:
     *
     * drive.google.com/thumbnail?id=...
     *
     * y pueden usarse directamente.
     */

    if (
        rawUrl.includes(
            "drive.google.com/thumbnail"
        )
    ) {

        return rawUrl;

    }


    /*
     * Compatibilidad con registros antiguos:
     *
     * drive.google.com/file/d/FILE_ID/view
     */

    if (
        rawUrl.includes(
            "drive.google.com"
        )
    ) {

        const matchId =
            rawUrl.match(
                /\/d\/([a-zA-Z0-9_-]+)/
            ) ||

            rawUrl.match(
                /[?&]id=([a-zA-Z0-9_-]+)/
            );


        if (
            matchId &&
            matchId[1]
        ) {

            return (
                "https://drive.google.com/thumbnail?id=" +
                matchId[1] +
                "&sz=w500"
            );

        }

    }


    return rawUrl;

}



/* =========================================================
   FILTRAR COLECCION
========================================================= */

function filterCollection() {

    const searchEl =
        document.getElementById(
            "searchInput"
        );


    const query =
        searchEl

            ? searchEl.value
                .toLowerCase()
                .trim()

            : "";


    const filtered =
        fullCollectionData.filter(
            function (item) {


                const artist =
                    String(

                        item.artist ||
                        item.artista ||
                        ""

                    ).toLowerCase();


                const title =
                    String(

                        item.title ||
                        item.título ||
                        item.titulo ||
                        item.album ||
                        ""

                    ).toLowerCase();


                const format =
                    String(

                        item.format ||
                        item.formato ||
                        ""

                    ).toLowerCase();


                const matchesQuery =
                    artist.includes(
                        query
                    ) ||

                    title.includes(
                        query
                    );


                if (
                    currentCollectionFilter ===
                    "vinilo"
                ) {

                    return (
                        matchesQuery &&
                        (
                            format.includes(
                                "vinilo"
                            ) ||
                            format.includes(
                                "vinyl"
                            )
                        )
                    );

                }


                if (
                    currentCollectionFilter ===
                    "cd"
                ) {

                    return (
                        matchesQuery &&
                        format.includes(
                            "cd"
                        )
                    );

                }


                return matchesQuery;

            }
        );


    renderCollection(
        filtered
    );

}



/* =========================================================
   RENDER COLECCION
========================================================= */

function renderCollection(
    items
) {

    const listEl =
        document.getElementById(
            "collectionList"
        );


    if (
        items.length === 0
    ) {

        listEl.innerHTML =
            `
            <div class="text-center py-12 text-slate-500 text-xs">
                No hay discos registrados en esta categoría.
            </div>
            `;

        return;

    }


    listEl.innerHTML =
        items.map(
            function (item) {


                const artist =
                    item.artist ||
                    item.artista ||
                    "Desconocido";


                const title =
                    item.title ||
                    item.título ||
                    item.titulo ||
                    item.album ||
                    "Sin título";


                const format =
                    item.format ||
                    item.formato ||
                    "Vinilo";


                const year =
                    item.year ||
                    item.año ||
                    item.ano ||
                    "";


                /*
                 * Soporta varios nombres de columna,
                 * incluidos los que pudieras tener
                 * de versiones anteriores.
                 */

                const photoRaw =

                    item.photo ||

                    item.fotourl ||

                    item["foto url"] ||

                    item["photo url"] ||

                    item.imagen ||

                    item.image ||

                    "";


                const photoUrl =
                    getDirectImageUrl(
                        photoRaw
                    );


                const safeTitle =
                    escapeHtml(
                        title
                    );


                const safeArtist =
                    escapeHtml(
                        artist
                    );


                const safeFormat =
                    escapeHtml(
                        format
                    );


                const safeYear =
                    escapeHtml(
                        year
                    );


                const safePhoto =
                    escapeAttribute(
                        photoUrl
                    );


                return `
                    <div
                        class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex gap-3 items-center shadow-md"
                    >

                        <div
                            class="w-16 h-16 bg-slate-950 rounded-lg overflow-hidden flex-shrink-0 border border-slate-800 flex items-center justify-center"
                        >

                            ${
                                photoUrl

                                    ? `
                                        <img
                                            src="${safePhoto}"
                                            alt="${safeTitle}"
                                            class="w-full h-full object-cover"
                                            loading="lazy"
                                            referrerpolicy="no-referrer"
                                            onerror="
                                                this.onerror=null;
                                                this.style.display='none';
                                                this.nextElementSibling.style.display='block';
                                            "
                                        >

                                        <i
                                            class="fa-solid fa-compact-disc text-emerald-400 text-lg"
                                            style="display:none;"
                                        ></i>
                                    `

                                    : `
                                        <i
                                            class="fa-solid fa-compact-disc text-emerald-400 text-lg"
                                        ></i>
                                    `
                            }

                        </div>


                        <div
                            class="flex-1 min-w-0"
                        >

                            <h4
                                class="text-sm font-bold text-slate-100 truncate"
                            >
                                ${safeTitle}
                            </h4>


                            <p
                                class="text-xs text-emerald-400 truncate"
                            >
                                ${safeArtist}
                            </p>


                            <p
                                class="text-[10px] text-slate-400 mt-0.5"
                            >

                                ${safeFormat}

                                ${
                                    safeYear
                                        ? " • " + safeYear
                                        : ""
                                }

                            </p>

                        </div>

                    </div>
                `;

            }
        ).join("");

}



/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHtml(value) {

    return String(
        value == null
            ? ""
            : value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



function escapeAttribute(value) {

    return escapeHtml(
        value
    );

}
